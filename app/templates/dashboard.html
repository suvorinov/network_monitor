{% extends "base.html" %}

{% block content %}
<!-- Панель управления дашбордом -->
<div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
    <h1 class="text-xl neon-text flex items-center whitespace-nowrap">
        <i class="fa-solid fa-terminal mr-2"></i> root@monitor:~$ node_status
        <span class="cursor-blink ml-1"></span>
    </h1>
    
    <div class="flex items-center space-x-4 w-full md:w-auto">
        <!-- Поиск -->
        {% include "partials/_search_hostname.html" %}
        
        <!-- Фильтры статусов -->
        {% include "partials/_statuses.html" %}
    </div>
</div>

<!-- Индикатор загрузки (вне terminal-list, чтобы не удалялся при swap) -->
<span id="loading-spinner" class="loading-indicator">
    <i class="fa-solid fa-circle-notch fa-spin mr-2"></i>
</span>

<!-- Сетка терминалов -->
<div id="terminal-list" class="flex flex-col gap-2"
     hx-get="/htmx/terminals" hx-trigger="load, every 10s" hx-swap="innerHTML"
     hx-vals='{"page": "1", "status": "ALL", "q": ""}'
     hx-indicator="#loading-spinner">
    <div class="text-sm" style="color: var(--text-muted)">
        Инициализация сканера сети...
    </div>
</div>

{% endblock %}

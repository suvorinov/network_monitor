<!-- Head of table -->
<thead>
    <tr class="bg-terminal border-bottom-terminal">
        <th class="text-left p-3 w-[10%] sort-header text-muted cursor-pointer" data-sort="hostname" data-type="string">
            HOSTNAME <i class="fa-solid fa-sort ml-1 text-[8px] opacity-30"></i>
        </th>
        <th class="text-left p-3 w-[15%] sort-header text-muted cursor-pointer" data-sort="user" data-type="string">
            USER <i class="fa-solid fa-sort ml-1 text-[8px] opacity-30"></i>
        </th>
        <th class="text-left p-3 w-[12%] sort-header text-muted cursor-pointer" data-sort="ip" data-type="string">
            IP ADDRESS <i class="fa-solid fa-sort ml-1 text-[8px] opacity-30"></i>
        </th>
        <th class="text-center p-3 w-[9%] text-muted">STATUS</th>
        <th class="text-right p-3 w-[12%] sort-header text-muted cursor-pointer" data-sort="cpu" data-type="number">
            CPU <i class="fa-solid fa-sort ml-1 text-[8px] opacity-30"></i>
        </th>
        <th class="text-right p-3 w-[12%] sort-header text-muted cursor-pointer" data-sort="ram" data-type="number">
            RAM <i class="fa-solid fa-sort ml-1 text-[8px] opacity-30"></i>
        </th>
        <th class="text-right p-3 w-[12%] sort-header text-muted cursor-pointer" data-sort="disk" data-type="number">
            DISK <i class="fa-solid fa-sort ml-1 text-[8px] opacity-30"></i>
        </th>
        <th class="text-right p-3 w-[8%] sort-header text-muted cursor-pointer" data-sort="free" data-type="number">
            FREE <i class="fa-solid fa-sort ml-1 text-[8px] opacity-30"></i>
        </th>
        <th class="text-right p-3 w-[10%] sort-header text-muted cursor-pointer" data-sort="last_seen" data-type="string">
            LAST SEEN <i class="fa-solid fa-sort ml-1 text-[8px] opacity-30"></i>
        </th>
    </tr>
</thead>

<!-- Head of table -->
<thead>
    <tr style="background-color: var(--bg-terminal); border-bottom: 1px solid var(--border-color);">
        <th class="text-left p-3 w-[15%] sort-header" data-sort="hostname" data-type="string" style="color: var(--text-muted); cursor: pointer;">
            HOSTNAME <i class="fa-solid fa-sort ml-1 text-[8px] opacity-30"></i>
        </th>
        <th class="text-left p-3 w-[10%] sort-header" data-sort="user" data-type="string" style="color: var(--text-muted); cursor: pointer;">
            USER <i class="fa-solid fa-sort ml-1 text-[8px] opacity-30"></i>
        </th>
        <th class="text-left p-3 w-[12%] sort-header" data-sort="ip" data-type="string" style="color: var(--text-muted); cursor: pointer;">
            IP ADDRESS <i class="fa-solid fa-sort ml-1 text-[8px] opacity-30"></i>
        </th>
        <th class="text-center p-3 w-[9%]" style="color: var(--text-muted);">STATUS</th>
        <th class="text-right p-3 w-[12%] sort-header" data-sort="cpu" data-type="number" style="color: var(--text-muted); cursor: pointer;">
            CPU <i class="fa-solid fa-sort ml-1 text-[8px] opacity-30"></i>
        </th>
        <th class="text-right p-3 w-[12%] sort-header" data-sort="ram" data-type="number" style="color: var(--text-muted); cursor: pointer;">
            RAM <i class="fa-solid fa-sort ml-1 text-[8px] opacity-30"></i>
        </th>
        <th class="text-right p-3 w-[12%] sort-header" data-sort="disk" data-type="number" style="color: var(--text-muted); cursor: pointer;">
            DISK <i class="fa-solid fa-sort ml-1 text-[8px] opacity-30"></i>
        </th>
        <th class="text-right p-3 w-[8%] sort-header" data-sort="free" data-type="number" style="color: var(--text-muted); cursor: pointer;">
            FREE <i class="fa-solid fa-sort ml-1 text-[8px] opacity-30"></i>
        </th>
        <th class="text-right p-3 w-[10%] sort-header" data-sort="last_seen" data-type="string" style="color: var(--text-muted); cursor: pointer;">
            LAST SEEN <i class="fa-solid fa-sort ml-1 text-[8px] opacity-30"></i>
        </th>
    </tr>
</thead>

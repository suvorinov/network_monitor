<!-- Боковая панель навигации -->
<aside class="w-56 flex flex-col p-4 space-y-6 border-r" style="background-color: var(--bg-panel); border-color: var(--border-color);">
    
    <!-- ЛОГОТИП -->
    <div class="flex items-center space-x-2 neon-text text-sm mb-2">
        <i class="fa-solid fa-shield-halved"></i>
        <span class="font-bold tracking-widest">SYS_ADMIN</span>
    </div>

    <!-- 1. НАВИГАЦИЯ -->
    <div>
        <div class="text-[10px] uppercase tracking-wider mb-2" style="color: var(--text-muted);">// Navigation</div>
        <nav class="flex flex-col space-y-1">
            <a href="/" id="nav-dashboard" class="flex items-center space-x-3 rounded p-2 transition-colors" style="background-color: rgba(0, 212, 255, 0.1); color: var(--neon-blue);">
                <i class="fa-solid fa-desktop w-5 text-center"></i>
                <span class="text-xs font-bold">Дашборд</span>
            </a>
            <!-- Инциденты = Офлайн ПК -->
            <a href="#" id="nav-incidents" onclick="App.filterOffline(); return false;" class="flex items-center space-x-3 rounded p-2 hover:bg-[rgba(255,255,255,0.05)] transition-colors" style="color: var(--text-muted);">
                <i class="fa-solid fa-triangle-exclamation w-5 text-center"></i>
                <span class="text-xs">Инциденты</span>
                <!-- Динамический индикатор количества офлайн ПК -->
                <span id="incident-badge" class="ml-auto text-[10px] font-bold px-1.5 py-0.5 rounded hidden" style="background-color: var(--neon-red); color: white;">0</span>
            </a>
        </nav>
    </div>

    <!-- 2. СТАТУС СИСТЕМЫ (Внизу) -->
    <div class="mt-auto">
        <div class="text-[10px] uppercase tracking-wider mb-3" style="color: var(--text-muted);">// System Status</div>
        <div class="space-y-2 text-xs">
            <div class="flex justify-between items-center">
                <span style="color: var(--text-muted);">Узлов в сети:</span>
                <span id="node-count" class="glow-green font-bold">0</span>
            </div>
            <div class="flex justify-between items-center">
                <span style="color: var(--text-muted);">Офлайн:</span>
                <span id="offline-count" class="glow-red font-bold">0</span>
            </div>
            <div class="flex justify-between items-center pt-2 border-t" style="border-color: var(--border-color);">
                <span style="color: var(--text-muted);">Сервер:</span>
                <span class="glow-green font-bold text-[10px]">ONLINE</span>
            </div>
        </div>
        
        <!-- Кнопка настроек -->
        <div class="mt-4 pt-4 border-t" style="border-color: var(--border-color);">
            <a href="#" id="nav-settings" onclick="App.openSettingsModal(); return false;" class="flex items-center space-x-3 rounded p-2 hover:bg-[rgba(255,255,255,0.05)] transition-colors" style="color: var(--text-muted);">
                <i class="fa-solid fa-gear w-5 text-center"></i>
                <span class="text-xs">Настройки</span>
            </a>
        </div>
    </div>
</aside>

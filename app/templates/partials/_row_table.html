<!-- Row of table --> 
<tr class="border-bottom-terminal cursor-pointer hover:bg-[rgba(0,255,157,0.05)] transition-colors"
    data-status="{{ pc.status }}" 
    data-sort-hostname="{{ pc.hostname|lower }}" 
    data-sort-user="{{ pc.current_user|lower }}" 
    data-sort-ip="{{ pc.ip_address|lower }}" 
    data-sort-cpu="{{ pc.cpu_percent }}" 
    data-sort-ram="{{ pc.ram_percent }}" 
    data-sort-disk="{{ pc.disk_percent }}" 
    data-sort-free="{{ pc.disk_free_gb }}" 
    data-sort-last_seen="{{ pc.last_seen.strftime('%Y-%m-%d %H:%M:%S') if pc.last_seen else '0000' }}"
    onclick="App.openHostModal('{{ pc.hostname|lower|e }}')">

    <!-- HOSTNAME -->
    <td class="text-left p-3 w-[10%] truncate font-bold text-accent">
        {{ pc.hostname }}
    </td>
    
    <!-- USER -->
    <td class="text-left p-3 w-[15%] truncate font-bold glow-blue">
        {{ pc.current_user }}
    </td>
    
    <!-- IP ADDRESS -->
    <td class="text-left p-3 w-[12%] truncate text-main">
        {{ pc.ip_address or 'N/A' }}
    </td>
    
    <!-- STATUS -->
    <td class="text-center p-3 w-[9%]">
        <span class="inline-flex items-center justify-center px-2 py-0.5 rounded text-[10px] font-bold {{ 'glow-green' if pc.status == 'ONLINE' else 'glow-red' }}" 
                style="background-color: {{ 'rgba(63, 185, 80, 0.1)' if pc.status == 'ONLINE' else 'rgba(248, 81, 73, 0.1)' }};">
            <i class="fa-solid fa-circle text-[5px] mr-1.5"></i>{{ pc.status }}
        </span>
    </td>
    
    <!-- CPU -->
    <td class="text-right p-3 w-[12%]">
        <div class="inline-flex items-center justify-end space-x-1.5">
            <div class="w-10 h-1.5 rounded-full flex-shrink-0 bg-terminal">
                <div class="h-1.5 rounded-full" style="width: {{ pc.cpu_percent }}%; background-color: {{ '#f85149' if pc.cpu_percent > CPU_WARN else 'var(--accent-green)' }};"></div>
            </div>
            <span class="w-9 text-right flex-shrink-0 {{ 'glow-red' if pc.cpu_percent > CPU_WARN else '' }}">{{ pc.cpu_percent }}%</span>
        </div>
    </td>
    
    <!-- RAM -->
    <td class="text-right p-3 w-[12%]">
        <div class="inline-flex items-center justify-end space-x-1.5">
            <div class="w-10 h-1.5 rounded-full flex-shrink-0 bg-terminal">
                <div class="h-1.5 rounded-full" style="width: {{ pc.ram_percent }}%; background-color: {{ '#f85149' if pc.ram_percent > RAM_WARN else 'var(--neon_blue)' }};"></div>
            </div>
            <div class="text-right flex-shrink-0">
                <div class="{{ 'glow-red' if pc.ram_percent > RAM_WARN else '' }}">{{ pc.ram_percent }}%</div>
                <!--
                <div class="text-[9px] text-muted">{{ pc.ram_available_gb }} Gb</div>
                -->
            </div>
        </div>
    </td>
    
    <!-- DISK -->
    <td class="text-right p-3 w-[12%]">
        <div class="inline-flex items-center justify-end space-x-1.5">
            <div class="w-10 h-1.5 rounded-full flex-shrink-0 bg-terminal">
                <div class="h-1.5 rounded-full" style="width: {{ pc.disk_percent }}%; background-color: {{ '#f85149' if pc.disk_percent > DISK_WARN else 'var(--neon_yellow)' }};"></div>
            </div>
            <span class="w-9 text-right flex-shrink-0 {{ 'glow-red' if pc.disk_percent > DISK_WARN else '' }}">{{ pc.disk_percent }}%</span>
        </div>
    </td>
    
    <!-- FREE DISK -->
    <td class="text-right p-3 w-[8%] text-main">
        {{ pc.disk_free_gb }} Gb
    </td>
    
    <!-- LAST SEEN -->
    <td class="text-right p-3 w-[10%] text-muted">
        {{ pc.last_seen.strftime('%H:%M:%S') if pc.last_seen else '--:--:--' }}
    </td>
</tr>
